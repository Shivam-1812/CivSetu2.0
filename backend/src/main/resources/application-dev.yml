spring:
  config:
    # Local secrets file (git-ignored). Dev only, so tests and CI never read it.
    import: optional:file:.env[.properties]
  docker:
    compose:
      # Starts backend/compose.yaml (PostGIS) and leaves it running between restarts
      file: compose.yaml
      lifecycle-management: start-only

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

civsetu:
  auth:
    refresh-cookie:
      # Local development runs over plain http
      secure: false

logging:
  level:
    com.civsetu: DEBUG
