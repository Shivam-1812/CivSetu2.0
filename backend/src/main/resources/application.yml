spring:
  application:
    name: civsetu-backend
  profiles:
    # IntelliJ / mvnw spring-boot:run start on dev; production sets SPRING_PROFILES_ACTIVE=prod
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes only through Flyway
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Hard limits in the servlet container; the per-kind rules live in civsetu.media
      max-file-size: 10MB
      max-request-size: 70MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

civsetu:
  scheduling:
    # Background jobs: workflow safety net, SLA monitor, expired-token cleanup
    enabled: true
  sla:
    # How often to look for issues past their deadline (each alert is sent once)
    check-interval: 15m
    batch-size: 100
  analytics:
    # Days are counted in this time zone for daily trends
    time-zone: Asia/Kolkata
  auth:
    # HMAC key for access tokens, at least 32 characters. Required; no default.
    jwt-secret: ${CIVSETU_JWT_SECRET:}
    issuer: civsetu
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-cookie:
      name: civsetu_refresh
      path: /api/v1/auth
      secure: true
      # Strict when frontend and API share a site; None when they are on different sites (needs secure)
      same-site: ${CIVSETU_REFRESH_COOKIE_SAMESITE:Strict}
    rate-limit:
      # Requests per minute per client IP
      login-per-minute: 10
      register-per-minute: 5
      refresh-per-minute: 30
  cors:
    allowed-origins: ${CIVSETU_CORS_ORIGINS:http://localhost:5173}
  media:
    # local (files under local.root) or s3 (any S3-compatible store, e.g. Cloudflare R2)
    storage: ${CIVSETU_MEDIA_STORAGE:local}
    max-file-size: 10MB
    max-images: 5
    max-voice-notes: 1
    # Photos are downscaled so the longest side is at most this many pixels
    max-image-dimension: 2560
    # Larger images are rejected before decoding (protects memory)
    max-image-megapixels: 50
    local:
      root: ${CIVSETU_MEDIA_ROOT:./uploads}
    s3:
      endpoint: ${CIVSETU_S3_ENDPOINT:}
      region: ${CIVSETU_S3_REGION:auto}
      bucket: ${CIVSETU_S3_BUCKET:}
      access-key: ${CIVSETU_S3_ACCESS_KEY:}
      secret-key: ${CIVSETU_S3_SECRET_KEY:}
  triage:
    # Longest wait for the AI before the rule engine decides instead
    timeout: 20s
    # AI answers below this confidence (0-1) are not used
    min-confidence: 0.6
    # Report photos sent to the AI
    max-images: 3
    # Department for issues no other department fits
    fallback-department: GENERAL
    gemini:
      # Leave empty to run on rules only
      api-key: ${CIVSETU_GEMINI_API_KEY:}
      model: ${CIVSETU_GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: https://generativelanguage.googleapis.com
  workflow:
    async-triage: true
    # Safety net: retries stuck triage and fills missing assignments
    sweep-interval: 60s
    retry-triage-after: 3m
    sweep-batch-size: 10
    max-reopens: 2
    reopen-window: 14d
  engagement:
    max-comments-per-user: 3
    # Net agree votes that make the system raise an open issue's priority one level (once)
    escalation-votes: 10
  duplicates:
    radius-meters: 200
    window-days: 30
    max-results: 5
  notifications:
    heartbeat: 25s
    stream-timeout: 30m
    ticket-ttl: 60s
    max-streams-per-user: 5
  bootstrap-admin:
    # Created on startup only when no Admin exists yet
    name: ${CIVSETU_BOOTSTRAP_ADMIN_NAME:CivSetu Admin}
    email: ${CIVSETU_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${CIVSETU_BOOTSTRAP_ADMIN_PASSWORD:}
