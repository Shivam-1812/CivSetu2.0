spring:
  application:
    name: civsetu-backend
  profiles:
    # IntelliJ / mvnw spring-boot:run start on dev; production sets SPRING_PROFILES_ACTIVE=prod
    default: dev
  config:
    # Local secrets file (git-ignored); absent in production, where real env vars are used
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes only through Flyway
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
