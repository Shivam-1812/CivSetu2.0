civsetu:
  auth:
    # Test-only key; never used outside the test suite
    jwt-secret: test-only-secret-key-for-civsetu-tests-0123456789
    refresh-cookie:
      secure: false
    rate-limit:
      # High limits so the suite is not throttled; the limiter has its own unit test
      login-per-minute: 1000
      register-per-minute: 1000
      refresh-per-minute: 1000
  media:
    storage: local
    local:
      root: target/test-uploads
  triage:
    gemini:
      # Tests never call Google: no key means the rule engine decides
      api-key: ""
  workflow:
    # Triage runs inline right after commit, so tests are deterministic
    async-triage: false
  scheduling:
    # No background jobs in tests; tests call the jobs directly
    enabled: false
  engagement:
    # Low threshold so escalation can be tested with a few voters
    escalation-votes: 3
  bootstrap-admin:
    email: ""
    password: ""
