# Local development database. Spring Boot's Docker Compose support starts it
# automatically on the dev profile; values come from backend/.env.
services:
  postgres:
    image: 'postgis/postgis:17-3.5'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL on 5432
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - civsetu-pgdata:/var/lib/postgresql/data
    labels:
      # PostGIS image is a PostgreSQL server; lets Spring Boot wire the datasource
      org.springframework.boot.service-connection: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Database browser for development: http://localhost:5050
  pgadmin:
    image: 'dpage/pgadmin4:9.18'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-not-used-in-desktop-mode}
      # Desktop mode: no pgAdmin login screen; reachable from this machine only
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      - civsetu-pgadmin:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      # Not a datasource; Spring Boot should only start it
      org.springframework.boot.ignore: 'true'

volumes:
  civsetu-pgdata:
  civsetu-pgadmin:
